<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{ nombre }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='jarvis.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>

<!-- Rejilla y barrido de fondo: el "vidrio" del HUD -->
<div class="grid-bg" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">{{ nombre }}</span>
    <span class="brand-sub" id="statusText">en línea</span>
  </div>
  <div class="topbar-right">
    <span class="lang-badge" id="langBadge" title="Idioma detectado">ES</span>
    <button class="icon-btn" id="muteBtn" title="Silenciar voz" aria-label="Silenciar voz">🔊</button>
    <button class="icon-btn" id="skillsBtn" title="Capacidades" aria-label="Capacidades">⚡</button>
    <button class="icon-btn" id="resetBtn" title="Nueva conversación" aria-label="Nueva conversación">⟳</button>
    <a class="icon-btn" href="/logout" title="Salir" aria-label="Salir">⏻</a>
  </div>
</header>

<main class="stage">

  <!-- ══ Columna izquierda: telemetría en vivo ══ -->
  <aside class="hud-left" id="hudLeft">
    <div class="hud-title">TELEMETRÍA</div>
    <div id="telemetry" class="telemetry">
      <div class="tele-loading">conectando…</div>
    </div>
  </aside>

  <!-- ══ Centro: reactor + conversación ══ -->
  <section class="core">
    <div class="reactor-wrap">
      <div class="reactor" id="reactor" role="button" tabindex="0"
           aria-label="Mantené presionado para hablar">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core-glow"></div>
        <canvas class="wave" id="wave" width="360" height="360" aria-hidden="true"></canvas>
        <div class="reactor-label" id="reactorLabel">HABLAR</div>
      </div>
    </div>

    <div class="hint" id="hint">Mantené presionado el reactor para hablar · o escribí abajo</div>

    <div class="transcript" id="transcript" aria-live="polite"></div>

    <div class="composer">
      <input id="input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Escribí una orden o pregunta…" aria-label="Mensaje">
      <button class="send-btn" id="sendBtn" aria-label="Enviar">▶</button>
    </div>
  </section>

  <!-- ══ Columna derecha: pantalla de datos y gráficos ══ -->
  <aside class="hud-right">
    <div class="hud-title">PANTALLA</div>
    <div id="screen" class="screen">
      <div class="screen-empty">Los datos y gráficos aparecen acá.</div>
    </div>
  </aside>
</main>

<!-- Confirmación de acciones que modifican el sistema -->
<div class="modal-backdrop" id="confirmModal" hidden>
  <div class="modal">
    <div class="modal-icon" aria-hidden="true">⚠</div>
    <h2>Confirmación requerida</h2>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmNo">Cancelar</button>
      <button class="btn danger" id="confirmYes">Confirmar</button>
    </div>
  </div>
</div>

<!-- Catálogo de capacidades -->
<div class="modal-backdrop" id="skillsModal" hidden>
  <div class="modal wide">
    <h2>Capacidades</h2>
    <div id="skillsList" class="skills-list"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="skillsClose">Cerrar</button>
    </div>
  </div>
</div>

<audio id="player" preload="none"></audio>

<script>
window.JARVIS_CONFIG = { voiceEnabled: {{ 'true' if voz_activa else 'false' }} };
</script>
<script src="{{ url_for('static', filename='jarvis.js') }}"></script>
</body>
</html>
