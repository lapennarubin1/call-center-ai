<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ nombre }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='jarvis.css') }}">
<style>
.login-stage{
  height:100vh;display:grid;place-items:center;position:relative;z-index:4;padding:20px;
}
.login-card{
  background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;
  padding:38px 34px;width:100%;max-width:360px;text-align:center;
  backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(56,217,245,.10);
}
.login-reactor{
  width:88px;height:88px;margin:0 auto 22px;position:relative;display:grid;place-items:center;
}
.login-reactor .ring-outer{width:100%;height:100%;border-style:dashed;opacity:.55;animation:spin 22s linear infinite}
.login-reactor .ring-mid{width:70%;height:70%;border-width:1.5px;border-color:transparent var(--cyan) transparent var(--cyan);animation:spin 8s linear infinite reverse}
.login-reactor .core-glow{width:34%;height:34%;opacity:.72}
.login-card h1{
  font-size:19px;letter-spacing:.28em;font-weight:700;margin-bottom:5px;
  text-shadow:0 0 16px var(--cyan-dim);
}
.login-card .sub{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase;margin-bottom:26px;
}
.login-card input{
  width:100%;background:rgba(4,8,15,.7);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink);
  font-family:var(--sans);font-size:14px;outline:none;margin-bottom:11px;
  transition:border-color .18s;
}
.login-card input:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(56,217,245,.08)}
.login-card input::placeholder{color:var(--ink-3)}
.login-card button{width:100%;padding:12px;margin-top:5px;font-size:13.5px;letter-spacing:.06em}
.login-err{
  font-size:12px;color:var(--red);margin-bottom:13px;
  padding:8px 11px;border-radius:8px;
  background:rgba(255,95,109,.09);border:1px solid rgba(255,95,109,.3);
}
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<div class="login-stage">
  <form class="login-card" method="post" autocomplete="off">
    <div class="login-reactor" aria-hidden="true">
      <div class="ring ring-outer"></div>
      <div class="ring ring-mid"></div>
      <div class="core-glow"></div>
    </div>
    <h1>{{ nombre }}</h1>
    <div class="sub">acceso restringido</div>

    {% if error %}<div class="login-err">{{ error }}</div>{% endif %}

    <input name="user" placeholder="Usuario" required autofocus
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <input name="pass" type="password" placeholder="Contraseña" required>
    <button class="btn" type="submit">Iniciar</button>
  </form>
</div>
</body>
</html>
