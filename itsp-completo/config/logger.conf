;=====================================================================
;  LOGGER.CONF  —  Habilita el canal "security" (lo lee fail2ban)
;=====================================================================
[general]
dateformat=%F %T

[logfiles]
console => notice,warning,error
messages => notice,warning,error
; Canal de seguridad: eventos de auth fallida, ACL, etc.
security => security
full => notice,warning,error,debug,verbose,dtmf
