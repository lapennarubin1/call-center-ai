;=====================================================================
;  FUNC_ODBC.CONF  —  Funciones a BD para DIDs propios
;  Requiere res_odbc.conf apuntando al DSN 'asterisk' (ver res_odbc.conf).
;  Estas funciones garantizan que el Caller ID SOLO use numeros que
;  existen en la tabla client_dids (es decir, numeros que TU compraste).
;=====================================================================

; Devuelve UN DID activo del pool del cliente (rotacion aleatoria).
; Uso en dialplan: ${ODBC_DID_NEXT(client1)}
[DID_NEXT]
dsn=asterisk
readsql=SELECT number FROM client_dids WHERE client='${SQL_ESC(${ARG1})}' AND active=1 ORDER BY RAND() LIMIT 1

; Devuelve el cliente dueño de un DID entrante (para ruteo inbound).
; Uso: ${ODBC_DID_OWNER(15551234567)}
[DID_OWNER]
dsn=asterisk
readsql=SELECT client FROM client_dids WHERE number='${SQL_ESC(${ARG1})}' AND active=1 LIMIT 1
