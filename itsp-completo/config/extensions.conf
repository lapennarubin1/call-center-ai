;=====================================================================
;  EXTENSIONS.CONF  —  Dialplan de la plataforma ITSP
;  Funcionalidad:
;    - Un contexto por cliente (aislamiento).
;    - Limite de canales simultaneos por cliente.
;    - Caller ID SOLO desde DIDs propios del cliente (pool en BD).
;    - Seleccion de proveedor: MANUAL por cliente + LCR (failover).
;    - Bloqueo anti-fraude de prefijos premium/alto costo.
;=====================================================================

[globals]
; Orden por defecto de proveedores (menor costo primero). Failover en cadena.
LCR_DEFAULT=telnyx,providerB,providerC
; Prefijos de ALTO RIESGO / premium a bloquear salvo autorizacion explicita.
; LITERALES (solo digitos, como los marca tu cliente). Ajusta a tu realidad.
; Ej: 00882/00881 = redes satelitales; 001900 = premium USA; etc.
BLOCKED_PREFIXES=00882,00881,001900,0087,00239,00252,00355

;=====================================================================
; SUBRUTINA: control de limite de canales por cliente
;   ARG1 = nombre del cliente ; ARG2 = maximo de canales
;=====================================================================
[sub-chanlimit]
exten => s,1,Set(GROUP()=${ARG1})
 same => n,GotoIf($[${GROUP_COUNT(${ARG1})} > ${ARG2}]?over)
 same => n,Return(0)
 same => n(over),NoOp(LIMITE de canales alcanzado para ${ARG1} (max ${ARG2}))
 same => n,Return(1)

;=====================================================================
; SUBRUTINA: bloqueo anti-fraude de destino
;   ARG1 = numero destino. Devuelve 1 si esta bloqueado.
;=====================================================================
[sub-fraudcheck]
exten => s,1,Set(DST=${ARG1})
 same => n,Set(i=1)
 same => n(loop),Set(PFX=${CUT(BLOCKED_PREFIXES,\,,${i})})
 same => n,GotoIf($["${PFX}"=""]?ok)          ; se acabo la lista -> permitido
 same => n,Set(PLEN=${LEN(${PFX})})
 same => n,GotoIf($["${DST:0:${PLEN}}"="${PFX}"]?blocked)  ; coincide el prefijo
 same => n,Set(i=$[${i}+1])
 same => n,Goto(loop)
 same => n(ok),Return(0)
 same => n(blocked),NoOp(DESTINO BLOQUEADO por anti-fraude: ${DST})
 same => n,Return(1)

;=====================================================================
; SUBRUTINA CENTRAL DE SALIDA (LCR + failover entre proveedores)
;   ARG1 = destino ; ARG2 = lista de proveedores separada por coma
;=====================================================================
[sub-dialout]
exten => s,1,Set(DEST=${ARG1})
 same => n,Set(ORDER=${ARG2})
 same => n,Set(IDX=1)
 same => n(loop),Set(PROV=${CUT(ORDER,\,,${IDX})})
 same => n,GotoIf($["${PROV}"=""]?exhausted)
 same => n,NoOp(Intentando proveedor ${PROV} -> ${DEST})
 same => n,Dial(PJSIP/${DEST}@${PROV},60)
 same => n,Set(DS=${DIALSTATUS})
 same => n,NoOp(Resultado ${PROV}: ${DS})
 ; Si contesto/ocupado/no-contesta/cancelado -> resultado definitivo, no probar mas
 same => n,GotoIf($["${DS}"="ANSWER"|"${DS}"="BUSY"|"${DS}"="NOANSWER"|"${DS}"="CANCEL"]?done)
 ; CONGESTION / CHANUNAVAIL -> probar el siguiente proveedor
 same => n,Set(IDX=$[${IDX}+1])
 same => n,Goto(loop)
 same => n(exhausted),NoOp(Todos los proveedores fallaron para ${DEST})
 same => n,Playback(all-circuits-busy-now)
 same => n(done),Return()

;=====================================================================
; PLANTILLA DE CONTEXTO DE CLIENTE
;   Copia [from-clientN] por cada cliente. Personaliza:
;     - CLIENT   : identificador (debe coincidir con pjsip y BD)
;     - MAXCHANS : canales simultaneos permitidos
;     - PROVIDERS: orden de proveedores para ESTE cliente (seleccion MANUAL).
;                  Ej: "telnyx"            -> solo Telnyx
;                      "providerB,telnyx"  -> B primero, Telnyx de respaldo
;                  Si lo dejas con ${LCR_DEFAULT} usa el orden global.
;=====================================================================

;------------------------------ CLIENTE 1 ---------------------------
[from-client1]
exten => _X.,1,NoOp(== Saliente client1 -> ${EXTEN} ==)
 same => n,Set(CLIENT=client1)
 same => n,Set(MAXCHANS=10)
 same => n,Set(PROVIDERS=telnyx,providerB)      ; <-- seleccion manual por cliente
 same => n,Gosub(sub-fraudcheck,s,1(${EXTEN}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?blocked)
 same => n,Gosub(sub-chanlimit,s,1(${CLIENT},${MAXCHANS}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?limit)
 same => n,Set(CALLERID(num)=${ODBC_DID_NEXT(${CLIENT})})   ; DID PROPIO del cliente
 same => n,GotoIf($["${CALLERID(num)}"=""]?nodid)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Gosub(sub-dialout,s,1(${EXTEN},${PROVIDERS}))
 same => n,Hangup()
 same => n(blocked),Hangup(21)         ; call rejected
 same => n(limit),Playback(all-circuits-busy-now)
 same => n,Hangup(34)                  ; circuit congestion
 same => n(nodid),NoOp(SIN DID asignado a ${CLIENT} - se rechaza para no spoofear)
 same => n,Hangup(21)

;------------------------------ CLIENTE 2 ---------------------------
[from-client2]
exten => _X.,1,NoOp(== Saliente client2 -> ${EXTEN} ==)
 same => n,Set(CLIENT=client2)
 same => n,Set(MAXCHANS=20)
 same => n,Set(PROVIDERS=providerB,telnyx,providerC)
 same => n,Gosub(sub-fraudcheck,s,1(${EXTEN}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?blocked)
 same => n,Gosub(sub-chanlimit,s,1(${CLIENT},${MAXCHANS}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?limit)
 same => n,Set(CALLERID(num)=${ODBC_DID_NEXT(${CLIENT})})
 same => n,GotoIf($["${CALLERID(num)}"=""]?nodid)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Gosub(sub-dialout,s,1(${EXTEN},${PROVIDERS}))
 same => n,Hangup()
 same => n(blocked),Hangup(21)
 same => n(limit),Playback(all-circuits-busy-now)
 same => n,Hangup(34)
 same => n(nodid),Hangup(21)

;=====================================================================
; ENTRANTE DESDE PROVEEDORES (DIDs -> ruteo a cliente)
;   Aqui decides a que cliente entregar cada numero entrante.
;   Recomendado: tabla en BD que mapea DID -> cliente/extension.
;=====================================================================
[from-provider]
exten => _X.,1,NoOp(== Entrante ${EXTEN} desde proveedor ==)
 same => n,Set(DESTCLIENT=${ODBC_DID_OWNER(${EXTEN})})   ; a quien pertenece el DID
 same => n,GotoIf($["${DESTCLIENT}"=""]?nodest)
 same => n,Dial(PJSIP/${DESTCLIENT},30)
 same => n,Hangup()
 same => n(nodest),NoOp(DID ${EXTEN} sin destino configurado)
 same => n,Hangup(1)
