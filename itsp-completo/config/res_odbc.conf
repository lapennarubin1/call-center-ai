;=====================================================================
;  RES_ODBC.CONF  —  Conexion de Asterisk a MariaDB/MySQL
;  Necesitas: unixODBC + connector ODBC de MariaDB, y un DSN en
;  /etc/odbc.ini y /etc/odbcinst.ini (ver docs/INSTALL.md).
;=====================================================================
[asterisk]
enabled => yes
dsn => asterisk
username => asterisk_ro          ; usuario de BD (idealmente solo lectura para DIDs)
password => CAMBIA_ESTO_PASS_BD
pre-connect => yes
sanitysql => select 1
max_connections => 5
