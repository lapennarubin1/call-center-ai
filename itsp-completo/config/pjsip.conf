;=====================================================================
;  PJSIP.CONF  —  Plataforma ITSP / Reseller multi-proveedor
;  Estructura:
;    1) GLOBAL + TRANSPORTS  (con endurecimiento anti-ataque)
;    2) PROVEEDORES (trunks salientes)  -> Telnyx, ProveedorB, ProveedorC
;    3) PLANTILLAS DE CLIENTE (endpoints que se conectan a TU servidor)
;    4) CLIENTES DE EJEMPLO (client1, client2)
;  Reglas de oro:
;    - Ninguna llamada anonima entra: sin endpoint = rechazada.
;    - Cada cliente autentica con usuario+password FUERTE (cambialos).
;    - El Caller ID SIEMPRE sale de un DID que TU compraste (ver extensions.conf).
;=====================================================================

;---------------------------------------------------------------------
; 1) GLOBAL  — controles anti-fuerza-bruta / anti-escaneo
;---------------------------------------------------------------------
[global]
type=global
user_agent=SBC-Core                 ; oculta que corres Asterisk
default_realm=itsp.local
; Si alguien manda peticiones sin identificarse (escaneo SIP), se bloquea:
unidentified_request_count=5
unidentified_request_period=5
unidentified_request_prune_interval=30
max_initial_qualify_time=4

;---------------------------------------------------------------------
; 1) TRANSPORTS
;---------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Si el servidor esta detras de NAT, descomenta y pon tu IP publica:
;external_media_address=TU_IP_PUBLICA
;external_signaling_address=TU_IP_PUBLICA
; Opcional: restringe redes de clientes/proveedores a nivel transport
;local_net=10.0.0.0/8
;local_net=172.16.0.0/12
;local_net=192.168.0.0/16

; TLS (recomendado para clientes; ver docs para generar certificados)
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

;=====================================================================
; 2) PROVEEDORES (TRUNKS SALIENTES)
;    Cada proveedor = registration + auth + aor + endpoint + identify.
;    'identify' hace match del trafico ENTRANTE por IP del proveedor,
;    para que sus llamadas caigan en context=from-provider sin depender
;    de usuario/clave. RELLENA LAS IP/CIDR REALES desde el portal.
;=====================================================================

;--------------------------- TELNYX ---------------------------------
[telnyx-reg]
type=registration
transport=transport-udp
outbound_auth=telnyx-auth
server_uri=sip:sip.telnyx.com
client_uri=sip:REEMPLAZA_USUARIO_TELNYX@sip.telnyx.com
retry_interval=60
forbidden_retry_interval=300
expiration=3600
line=yes
endpoint=telnyx

[telnyx-auth]
type=auth
auth_type=userpass
username=REEMPLAZA_USUARIO_TELNYX
password=REEMPLAZA_PASSWORD_TELNYX

[telnyx-aor]
type=aor
contact=sip:sip.telnyx.com:5060
qualify_frequency=60

[telnyx]
type=endpoint
transport=transport-udp
context=from-provider
disallow=all
allow=ulaw,alaw
outbound_auth=telnyx-auth
aors=telnyx-aor
from_domain=sip.telnyx.com
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[telnyx-identify]
type=identify
endpoint=telnyx
; IMPORTANTE: pon los rangos de senalizacion actuales de Telnyx (portal).
; Ejemplo de placeholders (NO son definitivos, verifica en el portal):
match=192.76.120.0/24
match=64.16.250.0/24
match=sip.telnyx.com

;------------------------ PROVEEDOR B (auth por IP) ------------------
; Muchos mayoristas autentican por IP (sin usuario/clave saliente).
[providerB-aor]
type=aor
contact=sip:REEMPLAZA_HOST_PROVEEDOR_B:5060
qualify_frequency=60

[providerB]
type=endpoint
transport=transport-udp
context=from-provider
disallow=all
allow=ulaw,alaw
aors=providerB-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[providerB-identify]
type=identify
endpoint=providerB
match=REEMPLAZA_IP_PROVEEDOR_B/32

;------------------------ PROVEEDOR C (auth por credencial) ----------
[providerC-reg]
type=registration
transport=transport-udp
outbound_auth=providerC-auth
server_uri=sip:REEMPLAZA_HOST_PROVEEDOR_C
client_uri=sip:REEMPLAZA_USUARIO_C@REEMPLAZA_HOST_PROVEEDOR_C
retry_interval=60
forbidden_retry_interval=300
expiration=3600
line=yes
endpoint=providerC

[providerC-auth]
type=auth
auth_type=userpass
username=REEMPLAZA_USUARIO_C
password=REEMPLAZA_PASSWORD_C

[providerC-aor]
type=aor
contact=sip:REEMPLAZA_HOST_PROVEEDOR_C:5060
qualify_frequency=60

[providerC]
type=endpoint
transport=transport-udp
context=from-provider
disallow=all
allow=ulaw,alaw
outbound_auth=providerC-auth
aors=providerC-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[providerC-identify]
type=identify
endpoint=providerC
match=REEMPLAZA_IP_PROVEEDOR_C/32

;=====================================================================
; 3) PLANTILLAS DE CLIENTE  (herencia con (!) para no repetir)
;=====================================================================
[client-endpoint-tpl](!)
type=endpoint
transport=transport-udp
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
; Cada cliente entra a SU propio contexto (aislamiento entre clientes):
; se define en la instancia concreta (context=from-clientN)

[client-auth-tpl](!)
type=auth
auth_type=userpass

[client-aor-tpl](!)
type=aor
max_contacts=3
qualify_frequency=60
remove_existing=yes

;=====================================================================
; 4) CLIENTES DE EJEMPLO
;    Copia este bloque por cada nuevo call center.
;    Password: usa algo tipo `openssl rand -base64 24`
;=====================================================================
;---- CLIENTE 1 ----
[client1](client-endpoint-tpl)
context=from-client1
auth=client1-auth
aors=client1

[client1-auth](client-auth-tpl)
username=client1
password=CAMBIA_ESTO_PASS_FUERTE_1

[client1](client-aor-tpl)

;---- CLIENTE 2 ----
[client2](client-endpoint-tpl)
context=from-client2
auth=client2-auth
aors=client2

[client2-auth](client-auth-tpl)
username=client2
password=CAMBIA_ESTO_PASS_FUERTE_2

[client2](client-aor-tpl)
