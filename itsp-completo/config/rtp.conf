;=====================================================================
;  RTP.CONF  —  Rango de puertos de media + RTP estricto
;  Abre SOLO este rango en el firewall para RTP (ver nftables).
;=====================================================================
[general]
rtpstart=10000
rtpend=20000
; strictrtp descarta paquetes RTP que no vengan del par negociado:
; mitiga inyeccion de audio / RTP bleed.
strictrtp=yes
; Aprende la direccion remota pero de forma estricta:
rtpchecksums=no
