;=====================================================================
;  AÑADIR a /etc/asterisk/func_odbc.conf
;  Funcion que el dialplan generado usa para saber si un cliente
;  esta activo (lo desactiva el monitor antifraude o el saldo agotado).
;=====================================================================
[CLIENT_ACTIVE]
dsn=asterisk
readsql=SELECT active FROM clients WHERE client='${SQL_ESC(${ARG1})}' LIMIT 1
