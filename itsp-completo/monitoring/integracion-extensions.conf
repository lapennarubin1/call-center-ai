;=====================================================================
;  MODULO 2: integracion en extensions.conf
;  Dos cosas necesarias para que el monitor funcione:
;    (A) Marcar cada llamada con el nombre del cliente (accountcode)
;        para que el CDR sepa de quien es.
;    (B) Bloquear en el dialplan a un cliente deshabilitado (active=0),
;        para que el corte del monitor tenga efecto INMEDIATO en
;        llamadas nuevas (no solo cuelgue las activas).
;=====================================================================

; --- func_odbc.conf: añade esta funcion para consultar si el cliente esta activo ---
; [CLIENT_ACTIVE]
; dsn=asterisk
; readsql=SELECT active FROM clients WHERE client='${SQL_ESC(${ARG1})}' LIMIT 1

;=====================================================================
;  Reemplaza el inicio de CADA contexto [from-clientN] por este patron.
;  Ejemplo con client1 (replica en los demas cambiando CLIENT/MAXCHANS/PROVIDERS):
;=====================================================================
[from-client1]
exten => _X.,1,NoOp(== Saliente client1 -> ${EXTEN} ==)
 same => n,Set(CLIENT=client1)
 same => n,Set(MAXCHANS=10)
 same => n,Set(PROVIDERS=telnyx,providerB)
 ; (A) marca la llamada con el cliente para el CDR:
 same => n,Set(CDR(accountcode)=${CLIENT})
 same => n,Set(CHANNEL(accountcode)=${CLIENT})
 ; (B) si el cliente esta deshabilitado por fraude, rechaza de inmediato:
 same => n,GotoIf($["${ODBC_CLIENT_ACTIVE(${CLIENT})}"="1"]?activo)
 same => n,NoOp(Cliente ${CLIENT} DESHABILITADO - llamada rechazada)
 same => n,Hangup(21)
 same => n(activo),Gosub(sub-fraudcheck,s,1(${EXTEN}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?blocked)
 same => n,Gosub(sub-chanlimit,s,1(${CLIENT},${MAXCHANS}))
 same => n,GotoIf($["${GOSUB_RETVAL}"="1"]?limit)
 same => n,Set(CALLERID(num)=${ODBC_DID_NEXT(${CLIENT})})
 same => n,GotoIf($["${CALLERID(num)}"=""]?nodid)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Gosub(sub-dialout,s,1(${EXTEN},${PROVIDERS}))
 same => n,Hangup()
 same => n(blocked),Hangup(21)
 same => n(limit),Playback(all-circuits-busy-now)
 same => n,Hangup(34)
 same => n(nodid),Hangup(21)

;=====================================================================
;  NOTA IMPORTANTE sobre reactivar un cliente:
;  Cuando el monitor deshabilita un cliente (active=0), NO se reactiva
;  solo. Tu decides: investigas el pico, y si fue legitimo, haces:
;     UPDATE clients SET active=1 WHERE client='clientX';
;     asterisk -rx "core reload"
;  Esto es a proposito: ante duda de fraude, el sistema se queda cerrado.
;=====================================================================
