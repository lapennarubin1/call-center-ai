;=====================================================================
;  MODULO 1: TLS + SRTP  — añadidos a pjsip.conf
;  Copia estos bloques a tu pjsip.conf (o incluyelos con #include).
;  El transport-tls ya venia en el pjsip.conf base; aqui va el
;  endpoint de cliente CIFRADO (para clientes con IP dinamica).
;=====================================================================

; --- Transport TLS (si no lo tienes ya del pjsip.conf base) ---
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
ca_list_file=/etc/asterisk/keys/ca.crt
method=tlsv1_2
; verify_client=yes  ; actívalo si vas a emitir certificados por cliente (mTLS)

;=====================================================================
;  PLANTILLA DE CLIENTE CIFRADO (TLS señalización + SRTP audio)
;  Ventaja: el cliente NO necesita IP fija en el firewall; entra por
;  TLS + usuario/clave. El audio va cifrado (SRTP).
;=====================================================================
[client-tls-tpl](!)
type=endpoint
transport=transport-tls
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_encryption=sdes          ; SRTP (audio cifrado)
media_encryption_optimistic=no ; exige cifrado; no permite caer a RTP claro

;---- CLIENTE CIFRADO DE EJEMPLO (client3) ----
[client3](client-tls-tpl)
context=from-client3
auth=client3-auth
aors=client3

[client3-auth]
type=auth
auth_type=userpass
username=client3
password=CAMBIA_ESTO_PASS_FUERTE_3

[client3]
type=aor
max_contacts=3
qualify_frequency=60
remove_existing=yes

;=====================================================================
;  NOTAS DE INTEGRACION
;  1) En extensions.conf crea [from-client3] copiando la plantilla de
;     cliente (igual que client1/2). El cifrado es transparente al dialplan.
;  2) En el firewall (nftables) el puerto 5061/tcp puede abrirse mas
;     amplio que 5060, PORQUE la seguridad ya la da TLS + auth. Aun asi,
;     fail2ban sigue protegiendo contra fuerza bruta.
;  3) Config del softphone del cliente (ej. MicroSIP/Zoiper):
;       - Transport: TLS
;       - Puerto: 5061
;       - Servidor: sip.tudominio.com (el CN del certificado)
;       - Importar/confiar ca.crt
;       - SRTP: activado (obligatorio)
;  4) media_encryption_optimistic=no => si el cliente NO ofrece SRTP,
;     la llamada se rechaza. Eso evita que caiga a audio sin cifrar.
;=====================================================================
